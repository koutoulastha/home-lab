apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: traefik-gateway
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: All
    # One wildcard listener for every cluster-served host. HTTPRoutes keep their
    # specific hostnames and attach here because those intersect the wildcard.
    # See certificate.yaml for why this is a wildcard and not one cert per host.
    - name: websecure
      protocol: HTTPS
      port: 8443
      hostname: "*.koutoulastha.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-koutoulastha-dev-tls
            namespace: default
      allowedRoutes:
        namespaces:
          from: All
