providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gateway:
  namespacePolicy: All
# Expose the API/dashboard entrypoint ("traefik", :8080) on the Service so the
# Gateway HTTPRoute can use it as a backend. The chart serves the dashboard on
# this entrypoint at /dashboard/ and /api.
ports:
  traefik:
    expose:
      default: true
# Create the IngressRoute that routes /dashboard and /api on the "traefik"
# entrypoint to the internal api@internal handler. Without this the dashboard
# is enabled but unrouted (Traefik returns 404).
api:
  dashboard: true
ingressRoute:
  dashboard:
    enabled: true