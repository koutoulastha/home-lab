providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gateway:
  namespacePolicy: All
# Expose the API/dashboard entrypoint ("traefik", :8080) on an internal-only
# ClusterIP service ("traefik-internal") rather than the external LoadBalancer,
# so the dashboard is reachable ONLY through the Gateway (HTTPS) and never on
# the LAN-facing LB IP. The Gateway HTTPRoute backends to traefik-internal:8080.
ports:
  traefik:
    expose:
      default: false
      internal: true
service:
  additionalServices:
    internal:
      type: ClusterIP
# Create the IngressRoute that routes /dashboard and /api on the "traefik"
# entrypoint to the internal api@internal handler. Without this the dashboard
# is enabled but unrouted (Traefik returns 404).
api:
  dashboard: true
ingressRoute:
  dashboard:
    enabled: true