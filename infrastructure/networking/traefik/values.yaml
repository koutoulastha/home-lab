providers:
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
gateway:
  namespacePolicy: All
# Expose the API/dashboard entrypoint ("traefik", :8080) on an internal-only
# ClusterIP service ("traefik-internal") rather than the external LoadBalancer,
# so the dashboard is reachable ONLY through the Gateway (HTTPS) and never on
# the LAN-facing LB IP. The Gateway HTTPRoute backends to traefik-internal:8080.
ports:
  traefik:
    expose:
      default: false
      internal: true
service:
  additionalServices:
    internal:
      type: ClusterIP
# Create the IngressRoute that routes /dashboard and /api on the "traefik"
# entrypoint to the internal api@internal handler. Without this the dashboard
# is enabled but unrouted (Traefik returns 404).
api:
  dashboard: true
ingressRoute:
  dashboard:
    enabled: true

# Prometheus metrics. `service.enabled` creates the dedicated metrics Service
# the ServiceMonitor scrapes; without it the ServiceMonitor has no endpoints.
# addRoutersLabels is off by default and is what yields per-HTTPRoute request
# rate, latency and status codes — the highest-value signal in the cluster,
# since every service is reached through Traefik.
metrics:
  prometheus:
    addRoutersLabels: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true

# Access logging, off by default in this chart. JSON rather than the default
# common-log format because Alloy parses it into structured metadata; the
# text format would have to be regex-matched and would lose fields.
#
# This is the highest-volume log stream in the cluster and dominates Loki's
# 50Gi budget. Health and metrics endpoints are dropped on the Alloy side
# rather than here, so that a request that 500s on /healthz is still visible
# in Traefik's own debug output if it is ever needed.
#
# The chart's default for accessLog.fields.headers.defaultMode is already
# drop, and accessLog.addInternals defaults to false so Traefik's own
# internal endpoints (api@internal, dashboard, ping) are not access-logged
# at all. Set explicitly below for clarity.
accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        # Deliberately minimal. Authorization and Cookie headers must never
        # be logged: these lines are retained for 30 days and this is an
        # internet-facing edge.
        User-Agent: keep
