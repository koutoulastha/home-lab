apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: default
  hostnames:
    - "traefik.koutoulastha.dev"
  rules:
    - backendRefs:
        - name: traefik-internal
          port: 8080
