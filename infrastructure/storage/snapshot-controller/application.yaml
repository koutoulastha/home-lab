apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapshot-controller
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  sources:
    - repoURL: https://piraeus.io/helm-charts/
      chart: snapshot-controller
      # 5.2.0 is packaging-only vs 5.1.1 (both ship appVersion v8.6.0). It is
      # required for webhook.enabled to actually work — see values.yaml.
      targetRevision: 5.2.0
      helm:
        valueFiles:
          - $values/infrastructure/storage/snapshot-controller/values.yaml
    - repoURL: https://github.com/koutoulastha/home-lab.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
