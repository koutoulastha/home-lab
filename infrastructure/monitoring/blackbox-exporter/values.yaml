# prometheus-blackbox-exporter 11.17.2 (blackbox_exporter v0.28.0).
#
# Predictable Service name. Without this the chart derives
# blackbox-exporter-prometheus-blackbox-exporter, which every Probe below
# would have to spell out.
fullnameOverride: blackbox-exporter

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 64Mi

config:
  modules:
    # Standard in-cluster probe. Split-horizon DNS means these hostnames resolve
    # to the private address from here, so this module tests Traefik directly.
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        follow_redirects: true
        preferred_ip_protocol: ip4

    # Probes the PUBLIC path by connecting straight to Pangolin's edge IP.
    # Necessary because split-horizon DNS sends every in-cluster probe to the
    # private address, so nothing else here tests the edge or the public-facing
    # TLS certificate. Public DNS is NOT tested: the target is an IP literal.
    #
    # Connecting by IP means SNI and Host must both be forced to the real
    # hostname, or TLS fails on a name mismatch before HTTP is reached.
    # traefik. and grafana. are the hosts published through Pangolin; photos.
    # and argocd. have no public DNS record at all. traefik. is the one used
    # here because its edge yields a deterministic unauthenticated 302.
    #
    # follow_redirects MUST stay false and 302 MUST be the success code.
    # Pangolin auths before proxying: a cold request is answered 302 to
    # app.pangolin.net by the edge itself, without consulting the Newt tunnel.
    # Following that redirect reaches Pangolin's auth service, which returns
    # 200 even when this cluster is entirely unreachable — a false green.
    #
    # SCOPE: this proves Pangolin's edge + cert validity for this hostname.
    # A failure with "certificate is valid for ...traefik.default" means the
    # edge served Traefik's default cert: Pangolin Cloud has no valid
    # certificate (or route) for the hostname, typically a failed refresh.
    # It does NOT prove the Newt tunnel is up. That gap is revisited in Task 8.
    http_2xx_pangolin:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [302]
        follow_redirects: false
        preferred_ip_protocol: ip4
        headers:
          Host: traefik.koutoulastha.dev
        tls_config:
          server_name: traefik.koutoulastha.dev

    # gluetun's control server: {"port":N} with N > 0 while Proton forwards a
    # port. Fails on port 0 (forwarding lost) as well as on no answer. Used by
    # apps/media/qbittorrent/probe.yaml; route auth is opened for exactly this
    # GET in that app's gluetun-auth ConfigMap.
    http_gluetun_portforward:
      prober: http
      timeout: 5s
      http:
        valid_status_codes: [200]
        fail_if_body_not_matches_regexp:
          - '"port":[1-9]'
        preferred_ip_protocol: ip4

    # Jellyfin through Pangolin's public edge, by IP (like http_2xx_pangolin),
    # but this resource has Pangolin auth disabled, so the request is proxied
    # through the Newt tunnel to Jellyfin itself: 200 + "Healthy" proves the
    # whole path. A 302 here means Pangolin auth was re-enabled on the
    # resource. Used by apps/media/jellyfin/probe.yaml.
    http_jellyfin_pangolin:
      prober: http
      timeout: 10s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200]
        follow_redirects: false
        fail_if_body_not_matches_regexp:
          - Healthy
        preferred_ip_protocol: ip4
        headers:
          Host: jellyfin.koutoulastha.dev
        tls_config:
          server_name: jellyfin.koutoulastha.dev
