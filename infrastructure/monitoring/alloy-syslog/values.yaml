# grafana/alloy 1.12.1 (Alloy v1.19.2). TrueNAS syslog receiver only.
#
# WHY A SEPARATE APPLICATION: this is a network listener with a
# LoadBalancer Service, not a per-node collector. The `alloy` DaemonSet
# would open this port on every node; a Helm release is one controller
# type, so a singleton receiver has to be its own release. Same reasoning
# that made alloy-events separate.
#
# DO NOT SCALE ABOVE ONE REPLICA. A second replica would receive an
# arbitrary half of the syslog stream depending on LB hashing, and
# TrueNASLogIngestionStopped would then be measuring one of two receivers.

controller:
  type: deployment
  replicas: 1
  # The TLS secret volume. It MUST live here: the chart renders pod volumes
  # only from controller.volumes.extra (templates/controllers/_pod.yaml).
  # It was first written as alloy.extraVolumes — not a key in chart 1.12.1,
  # which has no values.schema.json, so Helm dropped it without a word. The
  # pod spec then mounted a volume that did not exist, the ReplicaSet could
  # not create a pod, and for 8 days the Service had a LoadBalancer IP with
  # nothing behind it.
  volumes:
    extra:
      - name: syslog-tls
        secret:
          secretName: syslog-tls

# No node_exporter-style host access needed: this reads a socket, not the host.
rbac:
  create: false

service:
  # The one new LAN-facing L4 endpoint in this design. Syslog is not HTTP and
  # therefore cannot go through Traefik like the Loki push path does.
  type: LoadBalancer
  # Cilium LB-IPAM assigns from the 192.168.20.240-250 pool. Pinned rather
  # than dynamic because TrueNAS is configured with a DNS name that resolves
  # here, and a reassignment on reschedule would silently stop ingestion.
  annotations:
    io.cilium/lb-ipam-ips: "192.168.20.242"

alloy:
  mounts:
    varlog: false
    extra:
      - name: syslog-tls
        mountPath: /etc/alloy/tls
        readOnly: true

  extraPorts:
    - name: syslog-tls
      port: 6514
      targetPort: 6514
      protocol: TCP

  extraEnv:
    - name: SYSLOG_TLS_DIR
      value: /etc/alloy/tls

  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

  configMap:
    content: |
      // RFC5424 syslog over TLS. Port 6514, not plaintext 514: this crosses
      // the LAN and carries the storage box's auth and audit lines.
      // LABELS: bounded only — host (1), facility and severity (fixed small
      // sets), app (the syslog program name: a few dozen TrueNAS daemons such
      // as middlewared, zed, smartd, kernel). procid and msgid are NOT kept:
      // procid is unbounded, and in RFC5424 mode the forwarded line is only
      // the MSG body, so header fields that are not labelled here are gone.
      //
      // These MUST be relabel_rules, not a loki.process stage.labels: the
      // syslog source applies relabel_rules and then deletes every label
      // starting with "__" before forwarding (Alloy syslogtarget.go, the
      // HasPrefix(lbl.Name, "__") loop). A downstream stage never sees the
      // __syslog_message_* values. The first version of this file used
      // stage.labels and would have shipped every line with no host,
      // facility or severity at all.
      loki.relabel "truenas" {
        forward_to = []   // rules-only component, consumed via .rules below
        rule {
          source_labels = ["__syslog_message_hostname"]
          target_label  = "host"
        }
        rule {
          source_labels = ["__syslog_message_facility"]
          target_label  = "facility"
        }
        rule {
          source_labels = ["__syslog_message_severity"]
          target_label  = "severity"
        }
        rule {
          source_labels = ["__syslog_message_app_name"]
          target_label  = "app"
        }
      }

      // RFC5424 syslog over TLS. Port 6514, not plaintext 514: this crosses
      // the LAN and carries the storage box's auth and audit lines.
      loki.source.syslog "truenas" {
        listener {
          address               = "0.0.0.0:6514"
          protocol              = "tcp"
          syslog_format         = "rfc5424"
          labels                = { job = "truenas-syslog" }
          use_incoming_timestamp = true
          // 128 KiB, not the 8192 default. TrueNAS (syslog_audit on) sends
          // messages over 60 KB — observed 60652/60653 bytes on first
          // connect. An oversized frame is a parse error that DROPS THE
          // CONNECTION, and TrueNAS retransmits its queue in order, so one
          // big message at the head blocked every message behind it: a
          // reconnect/reject loop every 60s with almost nothing delivered.
          // Kept below Loki's own max_line_size (default 256 KB, not
          // overridden in loki/values.yaml) so the fix does not just move
          // the rejection downstream.
          max_message_length     = 131072

          tls_config {
            cert_file = "/etc/alloy/tls/tls.crt"
            key_file  = "/etc/alloy/tls/tls.key"
          }
        }
        relabel_rules = loki.relabel.truenas.rules
        forward_to    = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          // In-cluster, so no auth and no Traefik hop — unlike the PVE hosts,
          // this receiver is already inside the cluster.
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

crds:
  create: false

serviceMonitor:
  enabled: true
