# No Certificate resource here: grafana.koutoulastha.dev intersects the existing
# wildcard listener on traefik-gateway. A per-host cert would also walk straight
# into the _acme-challenge CNAME hijack once this host is behind Pangolin — the
# wildcard validates at _acme-challenge.koutoulastha.dev, which carries no
# delegation. See infrastructure/networking/gateway/certificate.yaml.
#
# Every field the API server would default is written out explicitly below.
# This Application syncs with ServerSideApply=true, which diffs against the live
# object *including* server-applied defaults — so omitting them (as
# infrastructure/networking/traefik/httproute.yaml does, in an Application that
# does not use SSA) leaves this permanently OutOfSync with no error to explain
# it. Spelling them out also puts the actual routing behaviour in git rather
# than leaving it implied.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: default
  hostnames:
    - "grafana.koutoulastha.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1
