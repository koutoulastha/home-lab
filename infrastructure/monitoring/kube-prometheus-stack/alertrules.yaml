apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-curated
  namespace: monitoring
spec:
  groups:
    - name: homelab.rules
      rules:
        # The repo's ACME/Pangolin CNAME history makes a silent renewal failure
        # a realistic outage. Without this it is discovered from a browser
        # warning, after the fact.
        #
        # certmanager_* covers the certificates cert-manager issues in-cluster.
        # Pangolin's edge certificate is renewed by Pangolin Cloud, not
        # cert-manager, and has its own rule, PangolinEdgeCertExpiringSoon.
        - alert: CertificateExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
          for: 1h
          labels:
            severity: critical
          annotations:
            description: >-
              Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in
              {{ $value | printf "%.1f" }} days. Check for a stuck DNS-01 challenge
              with `dig CNAME _acme-challenge.<host>`, never a bare `dig TXT`.

        # A backup that quietly stops running is worth more than most
        # infrastructure alerts. The schedule is daily at 02:30; 30h allows one
        # missed run plus slack before alerting.
        # The `> 0` guard is load-bearing. CNPG does not omit this metric when no
        # backup has ever succeeded — it explicitly publishes 0 (see
        # pkg/management/postgres/webserver/metricserver/pg_collector.go). Without
        # the guard, `time() - 0 > 108000` is always true, so a freshly created or
        # restored cluster pages critical forever, and does so in exactly the state
        # this alert is supposed to make visible.
        - alert: PostgresBackupStale
          expr: |
            time() - cnpg_collector_last_available_backup_timestamp > 108000
              and cnpg_collector_last_available_backup_timestamp > 0
          for: 30m
          labels:
            severity: critical
          annotations:
            description: >-
              No successful CNPG backup for cluster {{ $labels.pod }} in over 30
              hours. Check `kubectl -n immich get backups.postgresql.cnpg.io`.

        # Loki's PVC is excluded here because LokiStorageFillingUp covers it at
        # a lower threshold (80%) with an actionable message. Without the
        # exclusion both fire above 85% at the same severity — two pages for
        # one condition. PersistentVolumeFillingUpFast deliberately still
        # covers Loki: it is predictive and critical, an escalation rather
        # than a duplicate.
        - alert: PersistentVolumeFillingUp
          expr: |
            kubelet_volume_stats_used_bytes{persistentvolumeclaim!~"storage-loki-.*"}
            /
            kubelet_volume_stats_capacity_bytes{persistentvolumeclaim!~"storage-loki-.*"}
            > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            description: >-
              PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is
              {{ $value | humanizePercentage }} full.

        # Trend-based: catches the Immich library growing into its volume before
        # the static threshold would, and catches sudden growth the 85% rule
        # would only report once it is already too late to act calmly.
        # The <15% guard matches upstream's own pairing. predict_linear alone
        # pages critical on any large, mostly-empty volume that sustains a heavy
        # write burst for an hour — a restore or a bulk import — while the volume
        # is still 80% free and in no danger.
        - alert: PersistentVolumeFillingUpFast
          expr: |
            predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0
              and
            kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
          for: 1h
          labels:
            severity: critical
          annotations:
            description: >-
              PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is
              projected to be full within 24 hours at the current rate.

        # The temporary grafana.koutoulastha.dev exclusion was removed in Task 8,
        # once that hostname got its HTTPRoute and its probe went green. Every
        # probed target is now genuinely covered.
        # The VPN port-forward probe (path="vpn-portforward") has its own
        # warning-level alert, QbittorrentPortForwardLost in apps/media; a lost
        # forwarded port is not a critical outage.
        - alert: BlackboxProbeFailed
          expr: probe_success{path!="vpn-portforward"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            description: >-
              Probe of {{ $labels.instance }} has been failing for 5 minutes.
              The 130.110.2.46 target is Pangolin's public EDGE, probed by IP (so
              public DNS is not tested): it failing means the edge itself or its
              TLS certificate. A cert with CN "TRAEFIK DEFAULT CERT" means the edge
              has no certificate or route for the hostname; check that resource's
              certificate status in Pangolin Cloud and re-trigger the refresh. It
              does NOT mean the Newt tunnel is down, and conversely a dead tunnel
              will not trip it, because Pangolin authenticates before proxying so
              no unauthenticated probe ever reaches the tunnel. An internal target
              failing means Traefik or the backing service.

        # The edge certificate is issued by Pangolin Cloud and can fail to
        # renew silently: in Sept 2026 the traefik. certificate refresh failed
        # and the edge fell back to Traefik's default cert, which surfaced only
        # as BlackboxProbeFailed once it had already broken. This warns while
        # the old certificate is still valid. It covers only the hostname the
        # pangolin-tunnel probe uses (SNI in http_2xx_pangolin), not every
        # Pangolin resource. The series is absent while TLS verification fails;
        # BlackboxProbeFailed covers that state.
        - alert: PangolinEdgeCertExpiringSoon
          expr: |
            (probe_ssl_earliest_cert_expiry{path="pangolin-public"} - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            description: >-
              Pangolin's edge certificate for the probed hostname expires in
              {{ $value | printf "%.1f" }} days, so its renewal is failing. Check
              the resource's certificate status in Pangolin Cloud and re-trigger
              the refresh.

        # A TrueNAS-side storage problem presents as pods stuck in
        # ContainerCreating rather than as anything the default rules catch.
        - alert: PodStuckContainerCreating
          expr: |
            kube_pod_container_status_waiting_reason{reason="ContainerCreating"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            description: >-
              Pod {{ $labels.namespace }}/{{ $labels.pod }} has been stuck in
              ContainerCreating for 15 minutes. Commonly an iSCSI or NFS mount
              failure — check the democratic-csi node pod on that node.

        # Loki's only retention backstop. Unlike Prometheus, Loki has no
        # retentionSize setting — retention is purely by time, so a volume
        # spike fills the PVC well before 30 days elapse, and a full PVC
        # stops ingestion exactly when something interesting is happening.
        #
        # This lives here, in a Prometheus rule, rather than in Loki's own
        # ruler on purpose: asking Loki to alert on Loki running out of disk
        # fails at the moment it is needed.
        - alert: LokiStorageFillingUp
          expr: |
            (
              kubelet_volume_stats_used_bytes{persistentvolumeclaim=~"storage-loki-.*"}
              /
              kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~"storage-loki-.*"}
            ) > 0.80
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Loki PVC is over 80% full"
            description: "{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full. Loki has no size-based retention: when this fills, ingestion stops."
