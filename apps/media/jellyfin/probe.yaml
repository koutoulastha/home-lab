# Jellyfin's Pangolin resource: edge + certificate + SSO gate.
#
# Pangolin SSO is kept ON for this resource (decided 2026-10-01: extra
# security; remote access is browser-only, native apps cannot pass SSO). The
# module therefore expects the edge's 302 to app.pangolin.net/auth/... and
# fails on a 200, which would mean SSO was turned off. It does not prove the
# Newt tunnel to Jellyfin is up.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: jellyfin-public
  namespace: media
spec:
  interval: 60s
  module: http_jellyfin_pangolin
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://130.110.2.46/health
      labels:
        path: jellyfin-public
