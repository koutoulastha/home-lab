# FlareSolverr renders untrusted indexer pages, so it gets as little network
# as possible: cluster DNS (to resolve `qbittorrent`) and gluetun's HTTP proxy.
# No `world` egress — Chrome reaches the internet only through the tunnel.
# Only Prowlarr may call it (plus the node, for kubelet probes).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flaresolverr
  namespace: media
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flaresolverr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "8191"
              protocol: TCP
    - fromEntities: [host]
      toPorts:
        - ports:
            - port: "8191"
              protocol: TCP
