apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  sources:
    - repoURL: https://immich-app.github.io/immich-charts
      chart: immich
      targetRevision: 0.12.0
      helm:
        valueFiles:
          # $values paths are always relative to the repo root, never to the
          # `path` of the source that carries the ref.
          - $values/apps/immich/values.yaml
    # One git source doing two jobs: supplying the values file above, and
    # rendering pvc.yaml + httproute.yaml. A source with `ref` may not also
    # set `chart`, which is why the chart is a separate source.
    - repoURL: https://github.com/koutoulastha/home-lab.git
      targetRevision: main
      ref: values
      path: apps/immich
      directory:
        # recurse defaults to false, which is what actually keeps db/ out of
        # this Application. The glob below is only a backstop for if recurse
        # is ever turned on — it needs db/** (not db) to match paths under it.
        exclude: '{application.yaml,values.yaml,db/**}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
